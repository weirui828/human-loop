# Streamlit paints some widget internals (checkbox fills, slider tracks, focus
# rings, sidebar) from these values, which CSS in app.py cannot reach. Both are
# needed for a consistent theme.

[theme]
base = "light"
primaryColor = "#64714d"
backgroundColor = "#e6ddde"
secondaryBackgroundColor = "#ffffff"
textColor = "#443235"
font = "sans serif"
